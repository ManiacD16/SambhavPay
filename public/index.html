  <script>
    try {
      var storedTheme = window.localStorage.getItem("sambhavpay-theme");
      var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", storedTheme || (systemDark ? "dark" : "light"));
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html { background: #F8FAFC; }
    html[data-theme="dark"] { background: #020817; }
    body { margin: 0; padding: 0; background: #F8FAFC; color: #07182F; }
    html[data-theme="dark"] body { background: #020817; color: #F8FBFF; }
